[project]
name = "gaia"
version = "0.1.0"
description = "Smart-home simulator that generates training data"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
]
