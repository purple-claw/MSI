# Room inventory v1: which loads each room gets, per home tier. Data only; loaded by
# gaia/home/inventory.py.
#
# tier -> room type -> list of entries, in draw order. Each entry:
#   class    load class (must be in gaia/registry/classes.yaml)
#   fixture  fixture type for lights (see FIXTURES in gaia/registry/registry.py), null for non-lights
#   circuit  main | accent | cove | task | night | decor for lights; none for non-lights
#   count    [min, max]: how many loads when the entry is present, drawn uniformly
#   archetypes  optional list of archetype names this entry applies to (default: all)
#   source   optional https URL for the numbers, or assumption (the default)
#   p        presence probability. For circuit main it is a weight: exactly one main entry per
#            room is chosen with probability p / sum(p) over the room's main entries.
#
# Every room type listed here gets exactly one main circuit light: the room's ambient light,
# which the lighting policy always switches. Accent, cove, task, night and decor circuits are
# switched by the lighting policy's activity scenes and rules (see gaia/policies/lighting.py).
#
# Protocol and system per load are assigned in gaia/home/inventory.py, not here.
# All values are source: assumption until Task 11 calibrates them from ETS.

basic:
  living:
    - {class: light.dimmable, fixture: downlight, circuit: main, count: [1, 1], p: 0.5}
    - {class: light.onoff, fixture: bulb, circuit: main, count: [1, 1], p: 0.5}
    - {class: fan.ceiling, fixture: null, circuit: none, count: [1, 1], p: 1.0}
