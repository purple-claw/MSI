# ---------- Climate and air ----------
# assumption: capability ranges and power_w unless power_source is a URL

climate.split_ac:
  domain: climate
  matter_device_type: room_air_conditioner
  capabilities:
    - {name: power, kind: binary}
    - {name: mode, kind: enum, values: [cool, dry, fan, auto]}
    # setpoint 16-30 C is an assumption (research §3.3 has no sourced range).
    - {name: setpoint, kind: celsius, lo: 16, hi: 30, unit: C}
    - {name: fan_speed, kind: count, lo: 1, hi: 5}
  # 1.5 T inverter: Blue Star IA518DXU rated cooling input 1315 W (Tier B). Used as `on` peak draw.
  power_w: {"on": 1315}
  power_source: https://ankurelectricals.com/products/bluestar-1-5-ton-5-star-inverter-split-air-conditioner
  waste_rule: unattended
  sleeper_counts_as_attended: true
  rooms: [bedroom, living, dining, study]

climate.vrf_indoor:
  domain: climate
  matter_device_type: room_air_conditioner
  capabilities:
    - {name: power, kind: binary}
    - {name: mode, kind: enum, values: [cool, dry, fan, auto]}
    - {name: setpoint, kind: celsius, lo: 16, hi: 30, unit: C}
    - {name: fan_speed, kind: count, lo: 1, hi: 5}
  power_w: {"on": 60}
  power_source: assumption
  waste_rule: unattended
  sleeper_counts_as_attended: true
  rooms: [bedroom, living]

climate.cassette_ac:
