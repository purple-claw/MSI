# GAIA load-class registry v1. Data only; loaded by gaia/registry/registry.py.
#
# Fields per class:
#   domain, matter_device_type (null if no Matter device type), capabilities,
#   power_w (state -> watts; keys on | standby | active), power_source
#   (URL, or the literal `assumption`), waste_rule (unattended | overrun:<min> | none),
#   rooms, sleeper_counts_as_attended (optional, default false: a sleeping occupant counts as
#   attending the load for the waste rule).
# Capability kinds: binary (implicit 0/1), level/position/tilt/hue/saturation (0-1),
#   kelvin/celsius/count (explicit lo/hi), enum (values), event.
# Where the research gives a range, the value is the midpoint and the range is in a comment.
# Power numbers: power_source is the URL of the research figure (research §3,
# .superpowers/research/g2-load-taxonomy.md) for the five sourced classes, else `assumption`.
# Where a class has a URL source but a power key is not from that source, a comment says so.

# ---------- Lighting ----------
# assumption: capability ranges and power_w unless power_source is a URL

light.onoff:
  domain: lighting
  matter_device_type: on_off_light
  capabilities:
    - {name: power, kind: binary}
  power_w: {"on": 12}
  power_source: assumption
  waste_rule: unattended
  rooms: [passage, bathroom, store, balcony, kitchen]

light.dimmable:
  domain: lighting
  matter_device_type: dimmable_light
  capabilities:
    - {name: power, kind: binary}
    - {name: level, kind: level, lo: 0, hi: 1}
  power_w: {"on": 10}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom, dining, kitchen]

light.tunable:
  domain: lighting
  matter_device_type: color_temperature_light
  capabilities:
    - {name: power, kind: binary}
    - {name: level, kind: level, lo: 0, hi: 1}
    # Retail Hue White Ambiance is ~2200-6500 K (research §3.1); 2700-6500 K is the design choice.
    - {name: cct, kind: kelvin, lo: 2700, hi: 6500, unit: K}
  power_w: {"on": 10}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom, dining, study, kitchen]

light.rgbw:
  domain: lighting
  matter_device_type: extended_color_light
  capabilities:
    - {name: power, kind: binary}
    - {name: level, kind: level, lo: 0, hi: 1}
    - {name: hue, kind: hue, lo: 0, hi: 1}
    - {name: saturation, kind: saturation, lo: 0, hi: 1}
  power_w: {"on": 15}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom]

light.rgbcct:
  domain: lighting
  matter_device_type: extended_color_light
  capabilities:
    - {name: power, kind: binary}
    - {name: level, kind: level, lo: 0, hi: 1}
    - {name: hue, kind: hue, lo: 0, hi: 1}
    - {name: saturation, kind: saturation, lo: 0, hi: 1}
    - {name: cct, kind: kelvin, lo: 2700, hi: 6500, unit: K}
  power_w: {"on": 18}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom, dining]

light.led_strip:
  domain: lighting
  matter_device_type: extended_color_light
  capabilities:
    - {name: power, kind: binary}
    - {name: level, kind: level, lo: 0, hi: 1}
    - {name: hue, kind: hue, lo: 0, hi: 1}
    - {name: saturation, kind: saturation, lo: 0, hi: 1}
  power_w: {"on": 12}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, kitchen, bedroom]

light.festival:
  domain: lighting
  matter_device_type: null
  capabilities:
    - {name: power, kind: binary}
    - {name: hue, kind: hue, lo: 0, hi: 1}
    - {name: saturation, kind: saturation, lo: 0, hi: 1}
  power_w: {"on": 20}
  power_source: assumption
  waste_rule: unattended
  rooms: [balcony, facade, terrace, gate]

# ---------- Media ----------
# assumption: capability ranges and power_w unless power_source is a URL

media.tv:
  domain: media
  matter_device_type: basic_video_player
  capabilities:
    - {name: power, kind: binary}
    - {name: source, kind: enum, values: [stb, streamer, airplay, spotify, hdmi1, hdmi2, bluetooth, radio, tv_app]}
    - {name: playback, kind: enum, values: [playing, paused, stopped]}
    - {name: volume, kind: level, lo: 0, hi: 1}
    - {name: mute, kind: binary}
  power_w: {"on": 120, standby: 0.5}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom]

media.stb_dth:
  domain: media
  matter_device_type: null
  capabilities:
    - {name: power, kind: binary}
    - {name: source, kind: enum, values: [stb, streamer, airplay, spotify, hdmi1, hdmi2, bluetooth, radio, tv_app]}
    - {name: playback, kind: enum, values: [playing, paused, stopped]}
  # Tata Sky guide: 18 W in use, 17 W standby (Tier C, not measured).
  power_w: {"on": 18, standby: 17}
  power_source: https://www.downtoearth.org.in/amp/story/environment/confusing-signal-38433
  waste_rule: unattended
  rooms: [living, bedroom]

media.streamer:
  domain: media
  matter_device_type: basic_video_player
  capabilities:
    - {name: power, kind: binary}
    - {name: source, kind: enum, values: [stb, streamer, airplay, spotify, hdmi1, hdmi2, bluetooth, radio, tv_app]}
    - {name: playback, kind: enum, values: [playing, paused, stopped]}
    - {name: volume, kind: level, lo: 0, hi: 1}
    - {name: mute, kind: binary}
  power_w: {"on": 6, standby: 0.5}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom]

media.speaker:
  domain: media
  matter_device_type: speaker
  capabilities:
    - {name: power, kind: binary}
    - {name: source, kind: enum, values: [stb, streamer, airplay, spotify, hdmi1, hdmi2, bluetooth, radio, tv_app]}
    - {name: playback, kind: enum, values: [playing, paused, stopped]}
    - {name: volume, kind: level, lo: 0, hi: 1}
    - {name: mute, kind: binary}
  # Sonos Arc idle draw 4.3 W at 120 V (Tier A). Playback draw is unsourced, so no `on` entry.
  # standby 4.3 W: Sonos idle draw, https://support.sonos.com/en/article/sonos-power-consumption-while-idle (Tier A).
  # on 20 W is an assumption. Mixed class, so power_source stays `assumption`.
  power_w: {"on": 20, standby: 4.3}
  power_source: assumption
  waste_rule: unattended
  rooms: [living, bedroom]

media.soundbar:
  domain: media
  matter_device_type: null
  capabilities:
    - {name: power, kind: binary}
    - {name: source, kind: enum, values: [stb, streamer, airplay, spotify, hdmi1, hdmi2, bluetooth, radio, tv_app]}
    - {name: playback, kind: enum, values: [playing, paused, stopped]}
    - {name: volume, kind: level, lo: 0, hi: 1}
    - {name: mute, kind: binary}
  power_w: {"on": 40, standby: 0.5}
  power_source: assumption
  waste_rule: unattended
  rooms: [living]

media.av_receiver:
